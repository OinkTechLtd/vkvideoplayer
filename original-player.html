<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Video Player SDK Style</title>
    
    <!-- Подключаем стили Video.js -->
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .player-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16/9;
            position: relative;
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Стилизуем Video.js под VK Player */
        .video-js {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .video-js .vjs-big-play-button {
            background-color: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            line-height: 80px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.2s;
        }

        .video-js .vjs-big-play-button:before {
            color: #fff;
            font-size: 40px;
            margin-left: -5px;
        }

        .video-js:hover .vjs-big-play-button,
        .video-js.vjs-paused .vjs-big-play-button {
            background-color: #0077FF; /* VK Blue */
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Контролбар в стиле ВК */
        .video-js .vjs-control-bar {
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            height: 50px;
            display: flex;
            align-items: center;
        }

        .video-js .vjs-play-control.vjs-playing:before,
        .video-js .vjs-play-control:before {
            font-size: 18px;
            color: #fff;
            text-shadow: none;
        }

        .video-js .vjs-volume-panel .vjs-volume-level {
            background-color: #0077FF;
        }

        .video-js .vjs-progress-control .vjs-progress-holder {
            background: rgba(255,255,255,0.3);
            height: 4px;
        }

        .video-js .vjs-progress-control .vjs-play-progress {
            background-color: #0077FF;
        }

        .video-js .vjs-time-tooltip,
        .video-js .vjs-mouse-display:after,
        .video-js .vjs-play-progress:after {
            background-color: #0077FF;
            color: #fff;
        }

        .video-js .vjs-current-time,
        .video-js .vjs-duration {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }

        .video-js .vjs-fullscreen-control:before {
            color: #fff;
            font-size: 18px;
        }

        /* Логотип ВК (фейковый для стиля) */
        .vk-watermark {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            pointer-events: none;
            z-index: 10;
        }
        .vk-watermark svg {
            width: 24px;
            height: 24px;
            fill: #0077FF;
        }

        /* Панель ввода для теста */
        .input-panel {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.9);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            z-index: 20;
            backdrop-filter: blur(5px);
        }
        
        input {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            width: 300px;
            outline: none;
        }
        
        button {
            padding: 8px 16px;
            background: #0077FF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #0066dd;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Логотип для стиля -->
        <div class="vk-watermark">
            <svg viewBox="0 0 24 24"><path d="M15.073 2H8.937C5.005 2 2 4.988 2 8.92v6.16C2 19.012 4.995 22 8.937 22h6.136c3.932 0 6.927-2.988 6.927-6.92V8.92C22 4.998 19.005 2 15.073 2zM17.9 13.85c.66.66.97.97.97 1.47 0 .5-.31.81-.97.81h-2.1c-1.5 0-2.27-.79-3.19-1.72-.85-.86-1.22-1.29-1.73-1.29-.25 0-.5.12-.5.69v1.85c0 .48-.15.77-1.55.77-4.06 0-5.73-2.75-5.73-5.96 0-2.27.97-4.53 2.88-4.53.77 0 1.05.33 1.05 1.07v2.6c0 .61.27.82.45.82.37 0 .68-.21 1.38-.92 1.96-2.03 3.35-3.57 4.73-3.57.61 0 .77.27.77.87v3.06c0 .45.2.61.33.61.27 0 .55-.16 1.11-.72l1.56-1.8c.46-.53.82-.7 1.23-.7.61 0 .87.31.87.97v4.2c0 .58-.27.86-1.63.86z"/></svg>
        </div>

        <video id="vk-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
            <p class="vjs-no-js">
                Для просмотра видео включите JavaScript и обновите браузер.
            </p>
        </video>

        <!-- Панель управления для ввода ссылок (можно убрать в продакшене) -->
        <div class="input-panel">
            <input type="text" id="videoUrl" placeholder="Вставь ссылку (.mp4, .m3u8)" value="">
            <button onclick="loadVideo()">Играть</button>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        // Инициализация плеера
        var player = videojs('vk-player', {
            fluid: false,
            responsive: true,
            playbackRates: [0.5, 1, 1.5, 2],
            controlBar: {
                children: [
                    'playToggle',
                    'volumePanel',
                    'currentTimeDisplay',
                    'timeDivider',
                    'durationDisplay',
                    'progressControl',
                    'fullscreenToggle'
                ]
            }
        });

        // Функция загрузки видео
        function loadVideo() {
            var input = document.getElementById('videoUrl').value.trim();
            if (!input) return alert('Введите ссылку!');

            var source = null;
            var type = '';

            // 1. Прямые ссылки на MP4
            if (input.endsWith('.mp4')) {
                source = input;
                type = 'video/mp4';
            } 
            // 2. Ссылки на HLS (m3u8) - часто используются в стримах
            else if (input.endsWith('.m3u8')) {
                source = input;
                type = 'application/x-mpegURL';
            }
            else {
                // Пытаемся угадать или просим пользователя
                alert('Неизвестный формат. Пожалуйста, вставьте прямую ссылку на видеофайл (.mp4) или плейлист (.m3u8).');
                return;
            }

            // Установка источника
            player.src({
                src: source,
                type: type
            });
            
            player.play();
        }

        // Обработка ошибок
        player.on('error', function() {
            var error = player.error();
            console.error('Ошибка плеера:', error);
        });
    </script>
</body>
</html>
