<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VK Video Player</title>
    <style>
      html {
        width: 100%;
        height: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      .player-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .vk-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .player-container:hover .vk-controls {
        opacity: 1;
      }
      .vk-controls button {
        background: #636363;
        border: none;
        color: white;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      .vk-controls button:hover {
        background: #777;
      }
      .vk-controls input[type="range"] {
        flex: 1;
        height: 4px;
        -webkit-appearance: none;
        background: #444;
        border-radius: 2px;
        cursor: pointer;
      }
      .vk-controls input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="player-container" id="playerContainer">
        <video id="videoPlayer" playsinline></video>
        <div class="vk-controls" id="vkControls">
          <button id="playPauseBtn">▶</button>
          <input type="range" id="progressBar" value="0" min="0" step="0.1" />
          <span id="timeDisplay">0:00 / 0:00</span>
          <button id="volumeBtn">🔊</button>
          <input type="range" id="volumeBar" value="1" min="0" max="1" step="0.1" style="max-width: 80px;" />
          <button id="fullscreenBtn">⛶</button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const videoSrc = params.get('src');
        const videoType = params.get('type') || 'mp4';
        
        if (!videoSrc) {
          console.error('[VK Player] No src parameter provided');
          return;
        }

        const video = document.getElementById('videoPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeBtn = document.getElementById('volumeBtn');
        const volumeBar = document.getElementById('volumeBar');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const controls = document.getElementById('vkControls');

        let hls = null;
        let hideControlsTimeout = null;

        function formatTime(seconds) {
          if (isNaN(seconds)) return '0:00';
          const mins = Math.floor(seconds / 60);
          const secs = Math.floor(seconds % 60);
          return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function showControls() {
          controls.style.opacity = '1';
          clearTimeout(hideControlsTimeout);
          hideControlsTimeout = setTimeout(() => {
            if (!video.paused) controls.style.opacity = '0';
          }, 3000);
        }

        function loadVideo() {
          if (videoSrc.endsWith('.m3u8') || videoType === 'hls') {
            if (Hls.isSupported()) {
              hls = new Hls();
              hls.loadSource(videoSrc);
              hls.attachMedia(video);
              hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log('Autoplay prevented:', e));
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = videoSrc;
              video.addEventListener('loadedmetadata', () => {
                video.play().catch(e => console.log('Autoplay prevented:', e));
              });
            }
          } else {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', () => {
              video.play().catch(e => console.log('Autoplay prevented:', e));
            });
          }
        }

        // Event listeners
        playPauseBtn.addEventListener('click', () => {
          if (video.paused) {
            video.play();
            playPauseBtn.textContent = '⏸';
          } else {
            video.pause();
            playPauseBtn.textContent = '▶';
          }
        });

        video.addEventListener('timeupdate', () => {
          progressBar.value = video.currentTime;
          progressBar.max = video.duration || 100;
          timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        progressBar.addEventListener('input', () => {
          video.currentTime = progressBar.value;
        });

        volumeBar.addEventListener('input', () => {
          video.volume = volumeBar.value;
          volumeBtn.textContent = volumeBar.value == 0 ? '🔇' : '🔊';
        });

        volumeBtn.addEventListener('click', () => {
          video.muted = !video.muted;
          volumeBtn.textContent = video.muted ? '🔇' : '🔊';
          volumeBar.value = video.muted ? 0 : video.volume;
        });

        fullscreenBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.getElementById('app').requestFullscreen().catch(e => console.log(e));
          } else {
            document.exitFullscreen();
          }
        });

        video.addEventListener('play', () => {
          playPauseBtn.textContent = '⏸';
          showControls();
        });

        video.addEventListener('pause', () => {
          playPauseBtn.textContent = '▶';
          showControls();
        });

        document.getElementById('playerContainer').addEventListener('mousemove', showControls);
        document.getElementById('playerContainer').addEventListener('click', showControls);

        // Load video
        loadVideo();
        showControls();
      })();
    </script>
  </body>
</html>
